name: oficina-mecanica-fase-1

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Defina MSSQL_SA_PASSWORD no arquivo .env}
    volumes:
      - dados_sqlserver:/var/opt/mssql
    ports:
      - "127.0.0.1:1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -No -Q \"SELECT 1\" >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  api:
    build: .
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Oficina: "Server=sqlserver,1433;Database=OficinaMecanica;User Id=sa;Password=${MSSQL_SA_PASSWORD:?Defina MSSQL_SA_PASSWORD no arquivo .env};Encrypt=True;TrustServerCertificate=True"
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Configure JWT_SIGNING_KEY no arquivo .env}
      Bootstrap__AdminEmail: ${BOOTSTRAP_ADMIN_EMAIL:-}
      Bootstrap__AdminPassword: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    ports:
      - "127.0.0.1:5080:8080"
    depends_on:
      sqlserver:
        condition: service_healthy

volumes:
  dados_sqlserver:
