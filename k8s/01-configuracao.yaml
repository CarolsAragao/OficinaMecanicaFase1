apiVersion: v1 # Versão da API do Kubernetes usada pelo ConfigMap.
kind: ConfigMap # Tipo de recurso que guarda configurações comuns.
metadata: # Identificação do recurso.
  name: oficina-config # Nome que a API vai usar para encontrar esta configuração.
data: # Valores de configuração.
  ASPNETCORE_URLS: "http://+:8080" # Faz a API ouvir na porta 8080 quando ela iniciar.
