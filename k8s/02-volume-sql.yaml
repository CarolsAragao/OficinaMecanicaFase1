apiVersion: v1 # Versão da API do Kubernetes usada por este recurso.
kind: PersistentVolumeClaim # Solicita espaço de armazenamento ao cluster.
metadata: # Identificação do pedido.
  name: sqlserver-dados # Nome que o SQL Server vai usar para encontrar o volume.
spec: # Requisitos do armazenamento.
  accessModes: # Define como o volume pode ser montado.
    - ReadWriteOnce # Permite leitura e escrita por um nó de cada vez.
  resources: # Define o espaço solicitado.
    requests: # Capacidade mínima pedida.
      storage: 5Gi # Solicita 5 GiB para os arquivos do banco.
