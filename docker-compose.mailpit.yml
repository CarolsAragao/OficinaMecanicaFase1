name: oficina-mecanica-fase-1

services:
  mailpit:
    image: axllent/mailpit:v1.32.0
    ports:
      - "127.0.0.1:${MAILPIT_WEB_PORT:-8025}:8025"
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"

  api:
    environment:
      Smtp__Enabled: "true"
      Smtp__Host: mailpit
      Smtp__Port: "1025"
      Smtp__Security: None
      Smtp__FromEmail: notificacoes@oficina.local
      Smtp__FromName: Oficina Mecânica
    depends_on:
      mailpit:
        condition: service_started
