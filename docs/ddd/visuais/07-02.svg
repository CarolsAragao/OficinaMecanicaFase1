<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Referências por identidade" viewBox="0 0 1880 848" width="1880" height="848"><defs><marker id="head" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L7,4 L1,7 Z" fill="#4c686b"/></marker></defs><rect x="15" y="0" width="1844" height="846" rx="17" fill="#fff" stroke="#c9dbd7" stroke-width="1.5"/><text x="44" y="48" fill="#24745b" font-size="28" font-weight="700" font-family="Arial, sans-serif">B  Referências entre agregados por identidade</text><text x="45" y="75" fill="#5d7375" font-size="15" font-weight="400" font-family="Arial, sans-serif">Seta significa “conhece o ID / solicita operação ao dono”; nunca escrita direta no agregado de destino.</text><rect x="43" y="95" width="1785" height="82" rx="8" fill="#f7faf9" stroke="#f7faf9" stroke-width="0.5"/><rect x="57" y="106" width="420" height="58" rx="9" fill="#dff2e9" stroke="#24745b" stroke-width="1.5"/><text x="72" y="136" fill="#24745b" font-size="17" font-weight="700" font-family="Arial, sans-serif">OrdemDeServico</text><path d="M487 135 L812 135" fill="none" stroke="#4c686b" stroke-width="2" marker-end="url(#head)"/><rect x="552" y="101" width="208" height="30" rx="6" fill="#fff0cd" stroke="#a47823" stroke-width="1.5"/><text x="561" y="117" fill="#a47823" font-size="13" font-weight="700" font-family="Arial, sans-serif">ClienteId</text><rect x="826" y="106" width="480" height="58" rx="9" fill="#e0ebfc" stroke="#386a9d" stroke-width="1.5"/><text x="842" y="136" fill="#386a9d" font-size="17" font-weight="700" font-family="Arial, sans-serif">Cliente</text><text x="1325" y="127" fill="#5d7375" font-size="14" font-weight="400" font-family="Arial, sans-serif">A OS aponta para o cliente identificado.</text><rect x="57" y="194" width="420" height="58" rx="9" fill="#dff2e9" stroke="#24745b" stroke-width="1.5"/><text x="72" y="224" fill="#24745b" font-size="17" font-weight="700" font-family="Arial, sans-serif">OrdemDeServico</text><path d="M487 223 L812 223" fill="none" stroke="#4c686b" stroke-width="2" marker-end="url(#head)"/><rect x="552" y="189" width="208" height="30" rx="6" fill="#fff0cd" stroke="#a47823" stroke-width="1.5"/><text x="561" y="205" fill="#a47823" font-size="13" font-weight="700" font-family="Arial, sans-serif">VeiculoId</text><rect x="826" y="194" width="480" height="58" rx="9" fill="#e0ebfc" stroke="#386a9d" stroke-width="1.5"/><text x="842" y="224" fill="#386a9d" font-size="17" font-weight="700" font-family="Arial, sans-serif">Veiculo</text><text x="1325" y="215" fill="#5d7375" font-size="14" font-weight="400" font-family="Arial, sans-serif">A OS aponta para veículo próprio do cliente.</text><rect x="43" y="271" width="1785" height="82" rx="8" fill="#f7faf9" stroke="#f7faf9" stroke-width="0.5"/><rect x="57" y="282" width="420" height="58" rx="9" fill="#dff2e9" stroke="#24745b" stroke-width="1.5"/><text x="72" y="312" fill="#24745b" font-size="17" font-weight="700" font-family="Arial, sans-serif">OrdemDeServico</text><path d="M487 311 L812 311" fill="none" stroke="#4c686b" stroke-width="2" marker-end="url(#head)"/><rect x="552" y="277" width="208" height="30" rx="6" fill="#fff0cd" stroke="#a47823" stroke-width="1.5"/><text x="561" y="293" fill="#a47823" font-size="13" font-weight="700" font-family="Arial, sans-serif">OrcamentoId</text><rect x="826" y="282" width="480" height="58" rx="9" fill="#e0ebfc" stroke="#386a9d" stroke-width="1.5"/><text x="842" y="312" fill="#386a9d" font-size="17" font-weight="700" font-family="Arial, sans-serif">Orcamento</text><text x="1325" y="303" fill="#5d7375" font-size="14" font-weight="400" font-family="Arial, sans-serif">A OS consulta resultado; não altera valores</text><text x="1325" y="321" fill="#5d7375" font-size="14" font-weight="400" font-family="Arial, sans-serif">diretamente.</text><rect x="57" y="370" width="420" height="58" rx="9" fill="#dff2e9" stroke="#24745b" stroke-width="1.5"/><text x="72" y="400" fill="#24745b" font-size="17" font-weight="700" font-family="Arial, sans-serif">OrdemDeServico</text><path d="M487 399 L812 399" fill="none" stroke="#4c686b" stroke-width="2" marker-end="url(#head)"/><rect x="552" y="365" width="208" height="30" rx="6" fill="#fff0cd" stroke="#a47823" stroke-width="1.5"/><text x="561" y="381" fill="#a47823" font-size="13" font-weight="700" font-family="Arial, sans-serif">ServicoId</text><rect x="826" y="370" width="480" height="58" rx="9" fill="#e0ebfc" stroke="#386a9d" stroke-width="1.5"/><text x="842" y="400" fill="#386a9d" font-size="17" font-weight="700" font-family="Arial, sans-serif">CatalogoDeServico</text><text x="1325" y="391" fill="#5d7375" font-size="14" font-weight="400" font-family="Arial, sans-serif">Item da OS referencia serviço selecionado.</text><rect x="43" y="447" width="1785" height="82" rx="8" fill="#f7faf9" stroke="#f7faf9" stroke-width="0.5"/><rect x="57" y="458" width="420" height="58" rx="9" fill="#dff2e9" stroke="#24745b" stroke-width="1.5"/><text x="72" y="488" fill="#24745b" font-size="17" font-weight="700" font-family="Arial, sans-serif">OrdemDeServico</text><path d="M487 487 L812 487" fill="none" stroke="#4c686b" stroke-width="2" marker-end="url(#head)"/><rect x="552" y="453" width="208" height="30" rx="6" fill="#fff0cd" stroke="#a47823" stroke-width="1.5"/><text x="561" y="469" fill="#a47823" font-size="13" font-weight="700" font-family="Arial, sans-serif">ItemEstoqueId</text><rect x="826" y="458" width="480" height="58" rx="9" fill="#e0ebfc" stroke="#386a9d" stroke-width="1.5"/><text x="842" y="488" fill="#386a9d" font-size="17" font-weight="700" font-family="Arial, sans-serif">ItemEstoque</text><text x="1325" y="479" fill="#5d7375" font-size="14" font-weight="400" font-family="Arial, sans-serif">Item da OS referencia peça/insumo; não altera</text><text x="1325" y="497" fill="#5d7375" font-size="14" font-weight="400" font-family="Arial, sans-serif">saldo.</text><rect x="57" y="546" width="420" height="58" rx="9" fill="#dff2e9" stroke="#24745b" stroke-width="1.5"/><text x="72" y="576" fill="#24745b" font-size="17" font-weight="700" font-family="Arial, sans-serif">Orcamento</text><path d="M487 575 L812 575" fill="none" stroke="#4c686b" stroke-width="2" marker-end="url(#head)"/><rect x="552" y="541" width="208" height="30" rx="6" fill="#fff0cd" stroke="#a47823" stroke-width="1.5"/><text x="561" y="557" fill="#a47823" font-size="13" font-weight="700" font-family="Arial, sans-serif">IDs de item/serviço</text><rect x="826" y="546" width="480" height="58" rx="9" fill="#e0ebfc" stroke="#386a9d" stroke-width="1.5"/><text x="842" y="576" fill="#386a9d" font-size="17" font-weight="700" font-family="Arial, sans-serif">ItemEstoque / CatalogoDeServico</text><text x="1325" y="567" fill="#5d7375" font-size="14" font-weight="400" font-family="Arial, sans-serif">Valores usam itens referenciados; não editam</text><text x="1325" y="585" fill="#5d7375" font-size="14" font-weight="400" font-family="Arial, sans-serif">seus catálogos.</text><rect x="43" y="623" width="1785" height="82" rx="8" fill="#f7faf9" stroke="#f7faf9" stroke-width="0.5"/><rect x="57" y="634" width="420" height="58" rx="9" fill="#dff2e9" stroke="#24745b" stroke-width="1.5"/><text x="72" y="664" fill="#24745b" font-size="17" font-weight="700" font-family="Arial, sans-serif">ItemEstoque.ReservaPorOS</text><path d="M487 663 L812 663" fill="none" stroke="#4c686b" stroke-width="2" marker-end="url(#head)"/><rect x="552" y="629" width="208" height="30" rx="6" fill="#fff0cd" stroke="#a47823" stroke-width="1.5"/><text x="561" y="645" fill="#a47823" font-size="13" font-weight="700" font-family="Arial, sans-serif">OrdemDeServicoId</text><rect x="826" y="634" width="480" height="58" rx="9" fill="#e0ebfc" stroke="#386a9d" stroke-width="1.5"/><text x="842" y="664" fill="#386a9d" font-size="17" font-weight="700" font-family="Arial, sans-serif">OrdemDeServico</text><text x="1325" y="655" fill="#5d7375" font-size="14" font-weight="400" font-family="Arial, sans-serif">Reserva identifica a OS; alteração do saldo</text><text x="1325" y="673" fill="#5d7375" font-size="14" font-weight="400" font-family="Arial, sans-serif">pertence a ItemEstoque.</text><rect x="57" y="722" width="420" height="58" rx="9" fill="#dff2e9" stroke="#24745b" stroke-width="1.5"/><text x="72" y="752" fill="#24745b" font-size="17" font-weight="700" font-family="Arial, sans-serif">Veiculo</text><path d="M487 751 L812 751" fill="none" stroke="#4c686b" stroke-width="2" marker-end="url(#head)"/><rect x="552" y="717" width="208" height="30" rx="6" fill="#fff0cd" stroke="#a47823" stroke-width="1.5"/><text x="561" y="733" fill="#a47823" font-size="13" font-weight="700" font-family="Arial, sans-serif">ClienteId</text><rect x="826" y="722" width="480" height="58" rx="9" fill="#e0ebfc" stroke="#386a9d" stroke-width="1.5"/><text x="842" y="752" fill="#386a9d" font-size="17" font-weight="700" font-family="Arial, sans-serif">Cliente</text><text x="1325" y="743" fill="#5d7375" font-size="14" font-weight="400" font-family="Arial, sans-serif">Proprietário vinculado conforme D-16.</text></svg>