<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Mapa conceitual de Cadastros, Ordem de Serviço, Orçamento e Estoque com fluxos direcionais e avaliação de Identidade" viewBox="0 0 2230 1060" width="2230" height="1060"><defs><marker id="head-26826f" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L8,4.5 L1,8 Z" fill="#26826f"/></marker><marker id="head-aa7322" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L8,4.5 L1,8 Z" fill="#aa7322"/></marker><marker id="head-39749e" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L8,4.5 L1,8 Z" fill="#39749e"/></marker></defs><rect x="16" y="15" width="2198" height="1030" rx="22" fill="#fff" stroke="#c7d9d7" stroke-width="2" /><text x="55" y="71" fill="#18725a" font-size="34" font-weight="700" font-family="Arial, sans-serif">08  Context Map · limites de modelo da oficina</text><text x="56" y="108" fill="#546e73" font-size="17" font-weight="400" font-family="Arial, sans-serif">Setas representam a direção da informação/solicitação documentada. Caixas são linguagens de negócio, não serviços.</text><rect x="55" y="130" width="310" height="38" rx="9" fill="#e0f1e8" stroke="#18725a" stroke-width="1.5" /><text x="67" y="154" fill="#18725a" font-size="15" font-weight="700" font-family="Arial, sans-serif">Limite de contexto proposto</text><rect x="390" y="130" width="307" height="38" rx="9" fill="#eaf7f3" stroke="#26826f" stroke-width="1.5" /><text x="402" y="154" fill="#26826f" font-size="15" font-weight="700" font-family="Arial, sans-serif">Referência / dado de dono</text><rect x="720" y="130" width="226" height="38" rx="9" fill="#fff5df" stroke="#aa7322" stroke-width="1.5" /><text x="732" y="154" fill="#aa7322" font-size="15" font-weight="700" font-family="Arial, sans-serif">Solicitação</text><rect x="969" y="130" width="197" height="38" rx="9" fill="#eaf2fb" stroke="#39749e" stroke-width="1.5" /><text x="981" y="154" fill="#39749e" font-size="15" font-weight="700" font-family="Arial, sans-serif">Resultado</text><rect x="1190" y="130" width="372" height="38" rx="9" fill="#f0f3f3" stroke="#74858a" stroke-width="1.5" /><text x="1202" y="154" fill="#74858a" font-size="15" font-weight="700" font-family="Arial, sans-serif">Identidade: evidência insuficiente</text><rect x="75" y="205" width="450" height="300" rx="19" fill="#e2edfb" stroke="#386a9d" stroke-width="2.5" /><text x="100" y="257" fill="#386a9d" font-size="30" font-weight="700" font-family="Arial, sans-serif">Cadastros</text><text x="101" y="287" fill="#546e73" font-size="15" font-weight="400" font-family="Arial, sans-serif">Cliente · Veículo · Catálogo de serviço</text><rect x="98" y="310" width="404" height="77" rx="9" fill="#fff" stroke="#386a9d" stroke-width="1" /><text x="110" y="336" fill="#386a9d" font-size="16" font-weight="700" font-family="Arial, sans-serif">DONO · Cliente, Veiculo,</text><text x="110" y="357" fill="#386a9d" font-size="16" font-weight="700" font-family="Arial, sans-serif">CatalogoDeServico</text><text x="101" y="416" fill="#18363b" font-size="16" font-weight="400" font-family="Arial, sans-serif">• Valida CPF/CNPJ e placa; vincula</text><text x="101" y="439" fill="#18363b" font-size="16" font-weight="400" font-family="Arial, sans-serif">proprietário.</text><text x="101" y="474" fill="#18363b" font-size="16" font-weight="400" font-family="Arial, sans-serif">• Administrador gerencia serviços (D-15).</text><rect x="800" y="315" width="570" height="485" rx="19" fill="#e0f1e8" stroke="#18725a" stroke-width="2.5" /><text x="825" y="367" fill="#18725a" font-size="30" font-weight="700" font-family="Arial, sans-serif">Ordem de Serviço</text><text x="826" y="397" fill="#546e73" font-size="15" font-weight="400" font-family="Arial, sans-serif">Ciclo e linguagem da execução da OS</text><rect x="823" y="420" width="524" height="77" rx="9" fill="#fff" stroke="#18725a" stroke-width="1" /><text x="835" y="446" fill="#18725a" font-size="16" font-weight="700" font-family="Arial, sans-serif">DONO · OrdemDeServico, status, diagnóstico</text><text x="826" y="526" fill="#18363b" font-size="16" font-weight="400" font-family="Arial, sans-serif">• Recebimento, diagnóstico, execução e entrega.</text><text x="826" y="584" fill="#18363b" font-size="16" font-weight="400" font-family="Arial, sans-serif">• Encerramento por rejeição e impedimento como fatos.</text><text x="826" y="642" fill="#18363b" font-size="16" font-weight="400" font-family="Arial, sans-serif">• Consulta do cliente com campos mínimos (D-14).</text><rect x="1730" y="205" width="440" height="300" rx="19" fill="#f0e8f9" stroke="#7656a2" stroke-width="2.5" /><text x="1755" y="257" fill="#7656a2" font-size="30" font-weight="700" font-family="Arial, sans-serif">Orçamento</text><text x="1756" y="287" fill="#546e73" font-size="15" font-weight="400" font-family="Arial, sans-serif">Composição e decisão do cliente</text><rect x="1753" y="310" width="394" height="77" rx="9" fill="#fff" stroke="#7656a2" stroke-width="1" /><text x="1765" y="336" fill="#7656a2" font-size="16" font-weight="700" font-family="Arial, sans-serif">DONO · Orcamento, itens, aditivo,</text><text x="1765" y="357" fill="#7656a2" font-size="16" font-weight="700" font-family="Arial, sans-serif">valores</text><text x="1756" y="416" fill="#18363b" font-size="16" font-weight="400" font-family="Arial, sans-serif">• Geração após diagnóstico (D-00/D-03).</text><text x="1756" y="474" fill="#18363b" font-size="16" font-weight="400" font-family="Arial, sans-serif">• Consulta, aprovação ou rejeição (D-04 a</text><text x="1756" y="497" fill="#18363b" font-size="16" font-weight="400" font-family="Arial, sans-serif">D-06).</text><rect x="1730" y="650" width="440" height="300" rx="19" fill="#fff0cc" stroke="#a47823" stroke-width="2.5" /><text x="1755" y="702" fill="#a47823" font-size="30" font-weight="700" font-family="Arial, sans-serif">Estoque</text><text x="1756" y="732" fill="#546e73" font-size="15" font-weight="400" font-family="Arial, sans-serif">Peças e insumos em seu ciclo</text><rect x="1753" y="755" width="394" height="77" rx="9" fill="#fff" stroke="#a47823" stroke-width="1" /><text x="1765" y="781" fill="#a47823" font-size="16" font-weight="700" font-family="Arial, sans-serif">DONO · ItemEstoque, reserva, saldo,</text><text x="1765" y="802" fill="#a47823" font-size="16" font-weight="700" font-family="Arial, sans-serif">consumo</text><text x="1756" y="861" fill="#18363b" font-size="16" font-weight="400" font-family="Arial, sans-serif">• Disponibilidade, reserva, recusa e</text><text x="1756" y="884" fill="#18363b" font-size="16" font-weight="400" font-family="Arial, sans-serif">liberação.</text><text x="1756" y="919" fill="#18363b" font-size="16" font-weight="400" font-family="Arial, sans-serif">• Baixa só pelo consumo real; reposição.</text><rect x="75" y="755" width="450" height="193" rx="17" fill="#f0f3f3" stroke="#74858a" stroke-width="2" stroke-dasharray="9 7"/><text x="100" y="802" fill="#74858a" font-size="23" font-weight="700" font-family="Arial, sans-serif">Identidade e acesso · avaliação</text><text x="101" y="839" fill="#18363b" font-size="16" font-weight="400" font-family="Arial, sans-serif">PDF: JWT nas APIs administrativas. Usuário,</text><text x="101" y="862" fill="#18363b" font-size="16" font-weight="400" font-family="Arial, sans-serif">credencial, papéis e fronteira de modelo não</text><text x="101" y="885" fill="#18363b" font-size="16" font-weight="400" font-family="Arial, sans-serif">estão especificados.</text><text x="101" y="932" fill="#74858a" font-size="15" font-weight="700" font-family="Arial, sans-serif">Recorte transversal; contexto não fechado.</text><path d="M525 355 L800 455" fill="none" stroke="#26826f" stroke-width="3" marker-end="url(#head-26826f)" /><rect x="551" y="336" width="226" height="43" rx="9" fill="#eaf7f3" stroke="#26826f" stroke-width="1.5" /><text x="563" y="360" fill="#26826f" font-size="15" font-weight="700" font-family="Arial, sans-serif">Cliente/Veículo/Serviço</text><path d="M1370 435 L1730 341" fill="none" stroke="#aa7322" stroke-width="3" marker-end="url(#head-aa7322)" /><rect x="1430" y="330" width="258" height="43" rx="9" fill="#fff5df" stroke="#aa7322" stroke-width="1.5" /><text x="1442" y="354" fill="#aa7322" font-size="15" font-weight="700" font-family="Arial, sans-serif">Itens + diagnóstico →</text><path d="M1730 462 L1370 573" fill="none" stroke="#39749e" stroke-width="3" marker-end="url(#head-39749e)" /><rect x="1422" y="500" width="285" height="43" rx="9" fill="#eaf2fb" stroke="#39749e" stroke-width="1.5" /><text x="1434" y="524" fill="#39749e" font-size="15" font-weight="700" font-family="Arial, sans-serif">← decisão do orçamento</text><path d="M1370 658 L1730 767" fill="none" stroke="#aa7322" stroke-width="3" marker-end="url(#head-aa7322)" /><rect x="1430" y="664" width="254" height="43" rx="9" fill="#fff5df" stroke="#aa7322" stroke-width="1.5" /><text x="1442" y="688" fill="#aa7322" font-size="15" font-weight="700" font-family="Arial, sans-serif">Reserva / consumo →</text><path d="M1730 867 L1370 752" fill="none" stroke="#39749e" stroke-width="3" marker-end="url(#head-39749e)" /><rect x="1420" y="811" width="296" height="43" rx="9" fill="#eaf2fb" stroke="#39749e" stroke-width="1.5" /><text x="1432" y="835" fill="#39749e" font-size="15" font-weight="700" font-family="Arial, sans-serif">← disponibilidade / baixa</text><text x="57" y="1020" fill="#546e73" font-size="16" font-weight="400" font-family="Arial, sans-serif">Leitura: no sentido da seta, a origem fornece referência, pede ação ou devolve resultado. O dono da regra permanece na caixa que contém o conceito.</text></svg>