<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Fronteiras dos agregados" viewBox="0 0 1880 962" width="1880" height="962"><defs><marker id="head" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L7,4 L1,7 Z" fill="#4c686b"/></marker></defs><rect x="15" y="0" width="1844" height="960" rx="17" fill="#fff" stroke="#c9dbd7" stroke-width="1.5"/><text x="44" y="48" fill="#24745b" font-size="28" font-weight="700" font-family="Arial, sans-serif">A  Fronteiras dos seis agregados · proposta tática</text><text x="45" y="77" fill="#5d7375" font-size="15" font-weight="400" font-family="Arial, sans-serif">A raiz controla o estado dentro da borda. Entidades internas e VOs abaixo são candidatos, não decisões D-00…D-16.</text><rect x="44" y="102" width="566" height="391" rx="15" fill="#fafdfe" stroke="#24745b" stroke-width="2"/><rect x="56" y="115" width="542" height="55" rx="9" fill="#dff2e9" stroke="#24745b" stroke-width="1.5"/><text x="70" y="143" fill="#24745b" font-size="23" font-weight="700" font-family="Arial, sans-serif">«RAIZ» OrdemDeServico</text><text x="70" y="187" fill="#5d7375" font-size="12" font-weight="700" font-family="Arial, sans-serif">FRONTEIRA DO AGREGADO · núcleo da OS</text><rect x="61" y="209" width="532" height="64" rx="8" fill="#e0ebfc" stroke="#386a9d" stroke-width="1.5"/><text x="72" y="236" fill="#386a9d" font-size="15" font-weight="400" font-family="Arial, sans-serif">ENTIDADES · ItemDaOS (proposta); registro de</text><text x="72" y="255" fill="#386a9d" font-size="15" font-weight="400" font-family="Arial, sans-serif">diagnóstico associado</text><rect x="61" y="283" width="532" height="66" rx="8" fill="#efe8f9" stroke="#7656a2" stroke-width="1.5"/><text x="72" y="310" fill="#7656a2" font-size="15" font-weight="400" font-family="Arial, sans-serif">VOs · StatusOS; número da OS como identidade</text><rect x="61" y="360" width="532" height="111" rx="8" fill="#fff0cd" stroke="#a47823" stroke-width="1.5"/><text x="73" y="387" fill="#19393d" font-size="15" font-weight="400" font-family="Arial, sans-serif">INVARIANTE · Seis status oficiais; diagnóstico precede</text><text x="73" y="406" fill="#19393d" font-size="15" font-weight="400" font-family="Arial, sans-serif">orçamento; extra exige aprovação;</text><text x="73" y="425" fill="#19393d" font-size="15" font-weight="400" font-family="Arial, sans-serif">encerramento/impedimento são fatos separados.</text><text x="70" y="485" fill="#24745b" font-size="12" font-weight="700" font-family="Arial, sans-serif">D-00, D-02, D-05, D-06, D-12, D-14</text><rect x="644" y="102" width="566" height="391" rx="15" fill="#fafdfe" stroke="#24745b" stroke-width="2"/><rect x="656" y="115" width="542" height="55" rx="9" fill="#dff2e9" stroke="#24745b" stroke-width="1.5"/><text x="670" y="143" fill="#24745b" font-size="23" font-weight="700" font-family="Arial, sans-serif">«RAIZ» Orcamento</text><text x="670" y="187" fill="#5d7375" font-size="12" font-weight="700" font-family="Arial, sans-serif">FRONTEIRA DO AGREGADO · valores e aprovação</text><rect x="661" y="209" width="532" height="64" rx="8" fill="#e0ebfc" stroke="#386a9d" stroke-width="1.5"/><text x="672" y="236" fill="#386a9d" font-size="15" font-weight="400" font-family="Arial, sans-serif">ENTIDADES · ItemOrcado e Aditivo (propostas para</text><text x="672" y="255" fill="#386a9d" font-size="15" font-weight="400" font-family="Arial, sans-serif">manter histórico de aprovação)</text><rect x="661" y="283" width="532" height="66" rx="8" fill="#efe8f9" stroke="#7656a2" stroke-width="1.5"/><text x="672" y="310" fill="#7656a2" font-size="15" font-weight="400" font-family="Arial, sans-serif">VOs · Dinheiro; Quantidade/Unidade; valores orçados</text><rect x="661" y="360" width="532" height="111" rx="8" fill="#fff0cd" stroke="#a47823" stroke-width="1.5"/><text x="673" y="387" fill="#19393d" font-size="15" font-weight="400" font-family="Arial, sans-serif">INVARIANTE · Gerado pelo Sistema após diagnóstico;</text><text x="673" y="406" fill="#19393d" font-size="15" font-weight="400" font-family="Arial, sans-serif">aditivo aprovado antes de autorizar item; valores</text><text x="673" y="425" fill="#19393d" font-size="15" font-weight="400" font-family="Arial, sans-serif">mudam por decisões do próprio agregado.</text><text x="670" y="485" fill="#24745b" font-size="12" font-weight="700" font-family="Arial, sans-serif">D-00, D-03, D-04, D-05, D-06</text><rect x="1244" y="102" width="566" height="391" rx="15" fill="#fafdfe" stroke="#24745b" stroke-width="2"/><rect x="1256" y="115" width="542" height="55" rx="9" fill="#dff2e9" stroke="#24745b" stroke-width="1.5"/><text x="1270" y="143" fill="#24745b" font-size="23" font-weight="700" font-family="Arial, sans-serif">«RAIZ» ItemEstoque</text><text x="1270" y="187" fill="#5d7375" font-size="12" font-weight="700" font-family="Arial, sans-serif">FRONTEIRA DO AGREGADO · quantidades de estoque</text><rect x="1261" y="209" width="532" height="64" rx="8" fill="#e0ebfc" stroke="#386a9d" stroke-width="1.5"/><text x="1272" y="236" fill="#386a9d" font-size="15" font-weight="400" font-family="Arial, sans-serif">ENTIDADES · ReservaPorOS (proposta para rastrear</text><text x="1272" y="255" fill="#386a9d" font-size="15" font-weight="400" font-family="Arial, sans-serif">quantidades por OS)</text><rect x="1261" y="283" width="532" height="66" rx="8" fill="#efe8f9" stroke="#7656a2" stroke-width="1.5"/><text x="1272" y="310" fill="#7656a2" font-size="15" font-weight="400" font-family="Arial, sans-serif">VOs · Quantidade/Unidade; saldo físico; saldo</text><text x="1272" y="329" fill="#7656a2" font-size="15" font-weight="400" font-family="Arial, sans-serif">reservado</text><rect x="1261" y="360" width="532" height="111" rx="8" fill="#fff0cd" stroke="#a47823" stroke-width="1.5"/><text x="1273" y="387" fill="#19393d" font-size="15" font-weight="400" font-family="Arial, sans-serif">INVARIANTE · Consulta ao adicionar; reserva só após</text><text x="1273" y="406" fill="#19393d" font-size="15" font-weight="400" font-family="Arial, sans-serif">aprovação; peça inteira e insumo fracionável; baixa</text><text x="1273" y="425" fill="#19393d" font-size="15" font-weight="400" font-family="Arial, sans-serif">após consumo; desativado não entra em nova OS.</text><text x="1270" y="485" fill="#24745b" font-size="12" font-weight="700" font-family="Arial, sans-serif">D-07 a D-13</text><rect x="44" y="516" width="566" height="391" rx="15" fill="#fafdfe" stroke="#24745b" stroke-width="2"/><rect x="56" y="529" width="542" height="55" rx="9" fill="#dff2e9" stroke="#24745b" stroke-width="1.5"/><text x="70" y="557" fill="#24745b" font-size="23" font-weight="700" font-family="Arial, sans-serif">«RAIZ» Cliente</text><text x="70" y="601" fill="#5d7375" font-size="12" font-weight="700" font-family="Arial, sans-serif">FRONTEIRA DO AGREGADO · cadastro</text><rect x="61" y="623" width="532" height="64" rx="8" fill="#e0ebfc" stroke="#386a9d" stroke-width="1.5"/><text x="72" y="650" fill="#386a9d" font-size="15" font-weight="400" font-family="Arial, sans-serif">ENTIDADES · Nenhuma entidade interna exigida pelos</text><text x="72" y="669" fill="#386a9d" font-size="15" font-weight="400" font-family="Arial, sans-serif">fluxos; raiz possui identidade própria.</text><rect x="61" y="697" width="532" height="66" rx="8" fill="#efe8f9" stroke="#7656a2" stroke-width="1.5"/><text x="72" y="724" fill="#7656a2" font-size="15" font-weight="400" font-family="Arial, sans-serif">VOs · CPF/CNPJ validado</text><rect x="61" y="774" width="532" height="111" rx="8" fill="#fff0cd" stroke="#a47823" stroke-width="1.5"/><text x="73" y="801" fill="#19393d" font-size="15" font-weight="400" font-family="Arial, sans-serif">INVARIANTE · Documento inválido recusado; cliente</text><text x="73" y="820" fill="#19393d" font-size="15" font-weight="400" font-family="Arial, sans-serif">válido não encontrado cadastrado.</text><text x="70" y="899" fill="#24745b" font-size="12" font-weight="700" font-family="Arial, sans-serif">D-01</text><rect x="644" y="516" width="566" height="391" rx="15" fill="#fafdfe" stroke="#24745b" stroke-width="2"/><rect x="656" y="529" width="542" height="55" rx="9" fill="#dff2e9" stroke="#24745b" stroke-width="1.5"/><text x="670" y="557" fill="#24745b" font-size="23" font-weight="700" font-family="Arial, sans-serif">«RAIZ» Veiculo</text><text x="670" y="601" fill="#5d7375" font-size="12" font-weight="700" font-family="Arial, sans-serif">FRONTEIRA DO AGREGADO · cadastro</text><rect x="661" y="623" width="532" height="64" rx="8" fill="#e0ebfc" stroke="#386a9d" stroke-width="1.5"/><text x="672" y="650" fill="#386a9d" font-size="15" font-weight="400" font-family="Arial, sans-serif">ENTIDADES · Nenhuma entidade interna exigida; raiz</text><text x="672" y="669" fill="#386a9d" font-size="15" font-weight="400" font-family="Arial, sans-serif">mantém identidade própria.</text><rect x="661" y="697" width="532" height="66" rx="8" fill="#efe8f9" stroke="#7656a2" stroke-width="1.5"/><text x="672" y="724" fill="#7656a2" font-size="15" font-weight="400" font-family="Arial, sans-serif">VOs · Placa; marca/modelo/ano como dados descritivos</text><text x="672" y="743" fill="#7656a2" font-size="15" font-weight="400" font-family="Arial, sans-serif">(forma exata em aberto)</text><rect x="661" y="774" width="532" height="111" rx="8" fill="#fff0cd" stroke="#a47823" stroke-width="1.5"/><text x="673" y="801" fill="#19393d" font-size="15" font-weight="400" font-family="Arial, sans-serif">INVARIANTE · Placa única e associação ao cliente</text><text x="673" y="820" fill="#19393d" font-size="15" font-weight="400" font-family="Arial, sans-serif">proprietário.</text><text x="670" y="899" fill="#24745b" font-size="12" font-weight="700" font-family="Arial, sans-serif">D-16</text><rect x="1244" y="516" width="566" height="391" rx="15" fill="#fafdfe" stroke="#24745b" stroke-width="2"/><rect x="1256" y="529" width="542" height="55" rx="9" fill="#dff2e9" stroke="#24745b" stroke-width="1.5"/><text x="1270" y="557" fill="#24745b" font-size="23" font-weight="700" font-family="Arial, sans-serif">«RAIZ» CatalogoDeServico</text><text x="1270" y="601" fill="#5d7375" font-size="12" font-weight="700" font-family="Arial, sans-serif">FRONTEIRA DO AGREGADO · catálogo</text><rect x="1261" y="623" width="532" height="64" rx="8" fill="#e0ebfc" stroke="#386a9d" stroke-width="1.5"/><text x="1272" y="650" fill="#386a9d" font-size="15" font-weight="400" font-family="Arial, sans-serif">ENTIDADES · ServicoDeCatalogo (proposta com</text><text x="1272" y="669" fill="#386a9d" font-size="15" font-weight="400" font-family="Arial, sans-serif">identidade para seleção/histórico)</text><rect x="1261" y="697" width="532" height="66" rx="8" fill="#efe8f9" stroke="#7656a2" stroke-width="1.5"/><text x="1272" y="724" fill="#7656a2" font-size="15" font-weight="400" font-family="Arial, sans-serif">VOs · Descrição do serviço (candidato; formato a</text><text x="1272" y="743" fill="#7656a2" font-size="15" font-weight="400" font-family="Arial, sans-serif">detalhar)</text><rect x="1261" y="774" width="532" height="111" rx="8" fill="#fff0cd" stroke="#a47823" stroke-width="1.5"/><text x="1273" y="801" fill="#19393d" font-size="15" font-weight="400" font-family="Arial, sans-serif">INVARIANTE · Gestão pelo Administrador; uso pela OS</text><text x="1273" y="820" fill="#19393d" font-size="15" font-weight="400" font-family="Arial, sans-serif">não altera diretamente o catálogo.</text><text x="1270" y="899" fill="#24745b" font-size="12" font-weight="700" font-family="Arial, sans-serif">D-15</text></svg>