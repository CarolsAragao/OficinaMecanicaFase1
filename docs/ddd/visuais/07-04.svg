<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Camadas e responsabilidades" viewBox="0 0 1880 727" width="1880" height="727"><defs><marker id="head" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L7,4 L1,7 Z" fill="#4c686b"/></marker></defs><rect x="15" y="0" width="1844" height="725" rx="17" fill="#fff" stroke="#c9dbd7" stroke-width="1.5"/><text x="44" y="48" fill="#24745b" font-size="28" font-weight="700" font-family="Arial, sans-serif">D  Camadas DDD no monólito em camadas permitido</text><text x="45" y="75" fill="#5d7375" font-size="15" font-weight="400" font-family="Arial, sans-serif">Modelo de responsabilidade documental conforme Aula 05; sem escolha de tecnologia ou classes.</text><rect x="146" y="104" width="1575" height="110" rx="13" fill="#e0ebfc" stroke="#386a9d" stroke-width="2"/><text x="169" y="142" fill="#386a9d" font-size="22" font-weight="700" font-family="Arial, sans-serif">01  Interface de usuário / integração</text><text x="169" y="174" fill="#19393d" font-size="16" font-weight="400" font-family="Arial, sans-serif">Recebe pedidos/consultas e apresenta retornos; API é apenas a interface documental descrita no PDF.</text><path d="M932 216 L932 245" fill="none" stroke="#4c686b" stroke-width="2" marker-end="url(#head)"/><rect x="146" y="248" width="1575" height="110" rx="13" fill="#fff0cd" stroke="#a47823" stroke-width="2"/><text x="169" y="286" fill="#a47823" font-size="22" font-weight="700" font-family="Arial, sans-serif">02  Aplicação</text><text x="169" y="318" fill="#19393d" font-size="16" font-weight="400" font-family="Arial, sans-serif">Coordena a ordem das ações entre agregados e entrega o resultado; não decide invariantes nem edita estado interno diretamente.</text><path d="M932 360 L932 389" fill="none" stroke="#4c686b" stroke-width="2" marker-end="url(#head)"/><rect x="146" y="392" width="1575" height="110" rx="13" fill="#dff2e9" stroke="#24745b" stroke-width="2"/><text x="169" y="430" fill="#24745b" font-size="22" font-weight="700" font-family="Arial, sans-serif">03  Domínio</text><text x="169" y="462" fill="#19393d" font-size="16" font-weight="400" font-family="Arial, sans-serif">Abriga agregados, VOs, entidades e políticas D-00 a D-16; cada raiz controla seu próprio estado.</text><path d="M932 504 L932 533" fill="none" stroke="#4c686b" stroke-width="2" marker-end="url(#head)"/><rect x="146" y="536" width="1575" height="110" rx="13" fill="#efe8f9" stroke="#7656a2" stroke-width="2"/><text x="169" y="574" fill="#7656a2" font-size="22" font-weight="700" font-family="Arial, sans-serif">04  Infraestrutura</text><text x="169" y="606" fill="#19393d" font-size="16" font-weight="400" font-family="Arial, sans-serif">Oferece suporte técnico e registro das informações definidos pelas camadas superiores, sem possuir regras de negócio.</text><text x="50" y="704" fill="#5d7375" font-size="14" font-weight="400" font-family="Arial, sans-serif">Aplicação coordena; domínio protege invariantes; infraestrutura oferece suporte técnico. Todos podem residir no mesmo monólito.</text></svg>